# Ultralytics YOLO11-seg instance segmentation model with P2/4 - P5/32 outputs

# Parameters
nc: 1 # number of classes
# activation: nn.LeakyReLU(0.1)
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 203 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2        320
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4        160
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2             160
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8        80
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4             80
  - [-1, 1, Conv, [512, 3, 2]]              # 5-P4/16       40
  - [-1, 2, C3k2, [512, True]]              # 6             40
  - [-1, 1, Conv, [1024, 3, 2]]             # 7-P5/32       20
  - [-1, 2, C3k2, [1024, True]]             # 8             20
  - [-1, 1, SPPF, [1024, 5]]                # 9             
  - [-1, 2, C2PSA, [1024]]                  # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4   40
  - [-1, 2, C3k2, [512, False]]             # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3   80
  - [-1, 2, C3k2, [256, False]]             # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      
  - [[-1, 2], 1, Concat, [1]]               # cat backbone P2   160
  - [-1, 3, C2f, [128]]                     # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]                 # 20
  - [[-1, 16], 1, Concat, [1]]                 # 21 cat head P3 80
  - [-1, 2, C3k2, [256, False]]                # 22-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4  
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium) 40

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)  20

  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]] # Segment(P2, P3, P4, P5)

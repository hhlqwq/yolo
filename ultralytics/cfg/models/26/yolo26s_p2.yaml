# YOLO26s P2 目标检测模型，输出 P2/4 - P5/32。
# 模型文档: https://docs.ultralytics.com/models/yolo26
# 任务文档: https://docs.ultralytics.com/tasks/detect

# 模型参数。
nc: 2
end2end: False
reg_max: 16
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO26s 骨干网络。
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26s P2 检测头。
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 融合骨干网络 P4。
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 融合骨干网络 P3。
  - [-1, 2, C3k2, [256, True]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # 融合骨干网络 P2。
  - [-1, 2, C3k2, [128, True]] # 19-P2/4

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # 融合检测头 P3。
  - [-1, 2, C3k2, [256, True]] # 22-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 融合检测头 P4。
  - [-1, 2, C3k2, [512, True]] # 25-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 融合检测头 P5。
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28-P5/32

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 输出 P2、P3、P4、P5。
